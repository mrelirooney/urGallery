
services:
  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: urgallery_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: LittleIsland052121
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # optional (remove in prod)

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:LittleIsland052121@db:5432/urgallery_dev
      PUBLIC_API_BASE: http://localhost:8000
      SERVE_MEDIA: "true"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
        NEXT_PUBLIC_SITE_BASE: http://localhost:3000
    environment:
      DJANGO_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: